<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Never Miss Twice — fitness, voeding en gewoontes zonder wilskracht." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Alle paden zijn relatief, zodat de app net zo goed werkt op
         https://gebruiker.github.io/Sport-app/ als op een eigen domein. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Never Miss Twice</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Native ES-modules: de browser laadt dit rechtstreeks, er is geen
         bundelstap. GitHub Pages serveert deze bestanden ongewijzigd. -->
    <script type="module" src="./app/main.js"></script>

    <noscript>
      <div style="padding: 24px; font-family: sans-serif">
        <h1>Never Miss Twice</h1>
        <p>Deze app heeft JavaScript nodig om je gegevens lokaal te kunnen opslaan.</p>
      </div>
    </noscript>
  </body>
</html>
